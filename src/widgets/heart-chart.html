<script>
  function setBar(id, value, delta = 0) {
    const el = document.getElementById(id);
    if (!el) return;
    const min = Number(el.dataset.min), max = Number(el.dataset.max);
    const pct = v => Math.min(100, Math.max(0, ((v - min) / (max - min)) * 100));
    const now = pct(value), prev = pct(value - delta);
    el.style.setProperty('--val', now + '%');
    el.style.setProperty('--lo', Math.min(now, prev) + '%');
    el.style.setProperty('--hi', Math.max(now, prev) + '%');
    el.dataset.delta = delta > 0 ? 'up' : 'down';
    el.parentElement.dataset.label = `${value} / ${max}`;
  }

  function formatDeltaLabel(delta) {
    return delta <= 0 ? String(delta) : "+" + delta
  }

  function setReasonlabel(id, delta) {
    const el = document.getElementById(id);
    if (el && delta) el.innerHTML = formatDeltaLabel(delta.val) + " — " + delta.reason;
  }

  function setPrefsList(id, values) {
    const list = document.getElementById(id);
    if (!list) { return; }
    list.replaceChildren();

    for (const pref of Array.isArray(values) ? values : []) {
      const item = document.createElement('li');
      const span = document.createElement('span');
      span.classList.add('hover-info');
      span.innerHTML = pref.label;
      span.dataset.tip = pref.desc;
      item.append(span);

      list.append(item);
    }
  }

  function formatThinking(char, thoughts) {
    const name = char ? char.name : "CHARACTER";
    return `💭 ${name} thinks: ${thoughts}`;
  }

  window.addEventListener('message', (e) => {
    if (e.data?.type !== 'lorealm:state') return;
    const stats = e.data.props.state?.dating_sim;
    if (!stats) return;
    const { char } = window.lorealm?.context ?? {};
    const d = k => stats.deltas?.[k];

    setBar('ap-slider', stats.ap, d('ap')?.val);
    setBar('tp-slider', stats.tp, d('tp')?.val);
    setReasonlabel('ap-change', d('ap'));
    setReasonlabel('tp-change', d('tp'));

    document.getElementById('user-status').innerHTML = stats.status;
    document.getElementById('char-thoughts').innerHTML = formatThinking(char, stats.thoughts);
    setPrefsList('prefs-likes', stats.prefs?.likes);
    setPrefsList('prefs-dislikes', stats.prefs?.dislikes);
  });
</script>

<div class="hc-chart">
  <h4 class="hc-title">
    <span class="animated-heart-dsm">💖</span> {{char:name}}'s Heart Chart <span class="animated-heart-dsm">💖</span>
  </h4>
  <div class="hc-stat">
    <strong class="hc-label">Affection (AP):</strong>
    <div id="ap-slider" class="hc-bar" data-min="-200" data-max="200"></div>
    <em id="ap-change" class="hc-change"></em>
  </div>
  <div class="hc-stat hc-stat--last">
    <strong class="hc-label">Trust (TP):</strong>
    <div id="tp-slider" class="hc-bar" data-min="-100" data-max="200"></div>
    <em id="tp-change" class="hc-change">[+/- TP change & reason]</em>
  </div>
  <hr class="hc-divider">
  <p class="hc-status">
    <strong class="hc-label">Status with {{user:name}}:</strong>
    <span id="user-status" class="hc-value">[Status with {{user:name}}]</span>
  </p>
  <div class="hc-thought">
    <em id="char-thoughts">💭 {{char:name}} thinks: "[{{char:name}} concise thought of {{user:name}}]"</em>
  </div>
  <div class="hc-extras">
    <details>
      <summary>{{char:name}}'s Likes & Dislikes (click to expand)</summary>
      <div class="hc-likes-box">
          <strong class="hc-list-heading">Likes:</strong>
          <ul id="prefs-likes" class="hc-list hc-likes">
            <!-- LIKES_LIST_ITEMS_PLACEHOLDER -->
          </ul>
          <strong class="hc-list-heading">Dislikes:</strong>
          <ul id="prefs-dislikes" class="hc-list hc-dislikes">
            <!-- DISLIKES_LIST_ITEMS_PLACEHOLDER -->
          </ul>
      </div>
    </details>
  </div>
</div>

<style>

    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .hover-info:hover::after { opacity: 1; }
  details > summary { list-style-position: inside; user-select: none; cursor: pointer; font-weight: bold; color: #f8bbd0; margin-bottom: var(--spacing-xs); }
  details > summary::marker { color: #f8bbd0; }
  .hc-likes-box { margin-top: var(--spacing-xs); background-color: #5c4f6e; border-radius: 4px; padding: var(--spacing-sm); }
  .hc-list-heading { color: #f0e8f8; display: block; margin-bottom: var(--spacing-xs); }
  .hc-list { margin-left: var(--spacing-lg); padding-left: var(--spacing-xs); color: #e8d0f0; margin-top: 0; }
  .hc-likes { list-style-type: '✓ '; margin-bottom: var(--spacing-sm); }
  .hc-dislikes { list-style-type: '✗ '; margin-bottom: 0; }
  .hc-bar {
    /* fill color sampled between "bad" (right) and "good" (left) by current value */
    --fill: color-mix(in oklch, #ff8fc8 var(--val, 0%), #7f7a9e);
    position: relative;
    height: 10px;
    margin: 6px 0;
    border-radius: 999px;
    border: 1px solid #b0a0c0;
    background: #3a3046;
  }
  .hc-bar::before, .hc-bar::after { content: ''; position: absolute; inset: 0 auto 0 0; border-radius: inherit; }
  .hc-bar::before { width: var(--hi, 0%); background: var(--dc, transparent); }
  .hc-bar::after  { width: var(--lo, 0%); background: var(--fill); }
  .hc-bar[data-delta="up"]   { --dc: color-mix(in oklch, var(--fill), white 40%); }
  .hc-bar[data-delta="down"] { --dc: color-mix(in oklch, color-mix(in oklch, var(--fill), #ff3b5c 55%) 45%, transparent); }
</style>
